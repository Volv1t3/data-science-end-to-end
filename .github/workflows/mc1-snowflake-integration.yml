name: MC1 Snowflake integration

on:
  workflow_dispatch:
    inputs:
      pset2_ref:
        description: Referencia del repositorio Ciencia-De-Datos a integrar
        required: false
        default: master

permissions:
  contents: read

jobs:
  smoke:
    # No agregar pull_request: este job lee secretos y construye una imagen Docker.
    runs-on: ubuntu-latest
    environment: snowflake-integration
    env:
      PSET2_REPOSITORY: ${{ vars.PSET2_REPOSITORY || 'Volv1t3/Ciencia-De-Datos' }}
      PSET2_REF: ${{ inputs.pset2_ref || vars.PSET2_REF || 'master' }}
      MC1_SAMPLE_MAX_ROWS: ${{ vars.MC1_SAMPLE_MAX_ROWS || '50000' }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_EDA_PAT: ${{ secrets.SNOWFLAKE_EDA_PAT }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
      SNOWFLAKE_OBT_SCHEMA: ${{ vars.SNOWFLAKE_OBT_SCHEMA || 'S_CDATOS_PSET2_OBT' }}
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}

    steps:
      - name: Checkout del proyecto que contiene las pruebas
        uses: actions/checkout@v4

      - name: Checkout de la plataforma Spark del PSet 2
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PSET2_REPOSITORY }}
          ref: ${{ env.PSET2_REF }}
          path: pset2-platform

      - name: Comprobar configuración sin revelar secretos
        run: |
          test -n "$SNOWFLAKE_ACCOUNT"
          test -n "$SNOWFLAKE_USER"
          test -n "$SNOWFLAKE_DATABASE"
          test -n "$SNOWFLAKE_WAREHOUSE"
          if [ -z "$SNOWFLAKE_EDA_PAT" ] && [ -z "$SNOWFLAKE_PASSWORD" ]; then
            echo "Configure SNOWFLAKE_EDA_PAT o SNOWFLAKE_PASSWORD como secret."
            exit 1
          fi

      - name: Construir la imagen Spark del PSet 2
        run: |
          docker build \
            --file pset2-platform/src/main/psets/pset_2/src/res/docker/custom-images/Dockerfile.pset2.spark \
            --tag mc1-spark-integration:ci \
            pset2-platform/src/main/psets/pset_2/src/res

      - name: Extraer muestra acotada desde Snowflake
        run: |
          docker run --rm \
            --workdir /workspace/proyecto/modelado \
            --volume "$GITHUB_WORKSPACE/psets/proyecto:/workspace/proyecto:ro" \
            --volume "$GITHUB_WORKSPACE/pset2-platform/src/main/psets/pset_2/src/main/python/spark/lib:/opt/spark/lib:ro" \
            --volume "$RUNNER_TEMP:/out" \
            --env PYTHONPATH=/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.9-src.zip:/opt/spark/lib:/workspace/proyecto/modelado \
            --env SF_TEMPORARY_CREDENTIAL_CACHE_DIR=/tmp/snowflake-credential-cache \
            --env SNOWFLAKE_ACCOUNT --env SNOWFLAKE_USER \
            --env SNOWFLAKE_EDA_PAT --env SNOWFLAKE_PASSWORD \
            --env SNOWFLAKE_DATABASE --env SNOWFLAKE_SCHEMA \
            --env SNOWFLAKE_OBT_SCHEMA --env SNOWFLAKE_WAREHOUSE --env SNOWFLAKE_ROLE \
            mc1-spark-integration:ci \
            python exportar_muestra_mc1.py \
              --output /out/mc1_muestra_experimentos.csv \
              --manifest /out/mc1_muestra_experimentos.manifest.json \
              --max-rows "$MC1_SAMPLE_MAX_ROWS"

      - name: Verificar el contrato de la muestra dentro del contenedor
        run: |
          docker run --rm \
            --workdir /workspace/proyecto/modelado \
            --volume "$GITHUB_WORKSPACE/psets/proyecto:/workspace/proyecto:ro" \
            --volume "$RUNNER_TEMP:/out:ro" \
            --env PYTHONPATH=/workspace/proyecto/modelado \
            mc1-spark-integration:ci \
            python verificar_muestra_mc1.py \
              --csv /out/mc1_muestra_experimentos.csv \
              --manifest /out/mc1_muestra_experimentos.manifest.json
